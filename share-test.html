<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Проверка «Поделиться»</title>
<style>
  body{margin:0;padding:16px;background:#F0F2F5;color:#1A1C22;font:15px/1.4 -apple-system,'Segoe UI',Roboto,sans-serif;}
  h1{font-size:1.1rem;margin:0 0 4px;}
  p{margin:0 0 12px;color:#5A5F6E;font-size:.85rem;}
  button{display:block;width:100%;margin:0 0 8px;padding:14px;border:none;border-radius:12px;background:#2A7FFF;color:#fff;font:inherit;font-weight:700;text-align:left;}
  button small{display:block;font-weight:400;opacity:.85;font-size:.75rem;}
  .r{font-size:.8rem;margin:-4px 0 10px 4px;min-height:1em;}
  .ok{color:#15803D;font-weight:700;} .bad{color:#B91C1C;font-weight:700;}
  #env{font-size:.72rem;color:#5A5F6E;background:#fff;border-radius:10px;padding:10px;word-break:break-all;}
</style>
</head>
<body>
<h1>Проверка «Поделиться» в этом браузере</h1>
<p>Нажимайте кнопки по очереди. Если открылось меню «Поделиться» — просто закройте его. Потом пришлите скриншот всей страницы.</p>
<div id="tests"></div>
<div id="env"></div>
<script>
// Минимальный корректный PDF (одна страница с текстом) — без библиотек
function tinyPdf() {
  const objs = [
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>',
    null,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',
  ];
  const stream = 'BT /F1 24 Tf 72 760 Td (SplitHub share test) Tj ET';
  objs[3] = '<< /Length ' + stream.length + ' >>\nstream\n' + stream + '\nendstream';
  let out = '%PDF-1.4\n', offs = [];
  objs.forEach((o, i) => { offs.push(out.length); out += (i + 1) + ' 0 obj\n' + o + '\nendobj\n'; });
  const xref = out.length;
  out += 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n' + offs.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('');
  out += 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF';
  return new Blob([out], { type: 'application/pdf' });
}

function pngBlob() {
  return new Promise(res => {
    const c = document.createElement('canvas'); c.width = 400; c.height = 200;
    const g = c.getContext('2d'); g.fillStyle = '#F59E0B'; g.fillRect(0, 0, 400, 200);
    g.fillStyle = '#fff'; g.font = 'bold 32px sans-serif'; g.fillText('SplitHub test', 60, 110);
    c.toBlob(res, 'image/png');
  });
}

const files = {};
const tests = [
  ['Только текст и ссылка', 'без файла', () => ({ title: 'СплитХаб', text: 'Тест', url: 'https://splithub.ru/' })],
  ['Картинка PNG', 'image/png', () => ({ files: [files.png] })],
  ['Текстовый файл .txt', 'text/plain', () => ({ files: [files.txt] })],
  ['PDF (как в смете)', 'application/pdf, smeta-test.pdf', () => ({ files: [files.pdf] })],
  ['PDF + заголовок и текст', 'files + title + text', () => ({ files: [files.pdf], title: 'Смета', text: 'Смета для клиента' })],
  ['PDF без типа', 'application/octet-stream, .pdf', () => ({ files: [files.pdfOctet] })],
  ['PDF с коротким латинским именем', 'application/pdf, a.pdf', () => ({ files: [files.pdfShort] })],
];

function run(i) {
  const out = document.getElementById('r' + i);
  const [, , make] = tests[i];
  const data = make();
  const act = navigator.userActivation ? navigator.userActivation.isActive : '?';
  let can = '?';
  try { can = navigator.canShare ? navigator.canShare(data) : 'нет canShare'; } catch (e) { can = 'ошибка: ' + e.name; }
  if (!navigator.share) { out.innerHTML = '<span class="bad">navigator.share нет</span>'; return; }
  let p;
  try { p = navigator.share(data); } catch (e) { p = Promise.reject(e); }
  out.textContent = '…';
  p.then(
    () => { out.innerHTML = '<span class="ok">✓ меню открылось</span> · canShare: ' + can + ' · нажатие: ' + act; },
    e => {
      const cls = e && e.name === 'AbortError' ? 'ok' : 'bad';
      const msg = e && e.name === 'AbortError' ? '✓ меню открылось (закрыли)' : '✗ ' + (e && e.name) + ': ' + (e && e.message);
      out.innerHTML = '<span class="' + cls + '">' + msg + '</span> · canShare: ' + can + ' · нажатие: ' + act;
    });
}

(async () => {
  files.png = new File([await pngBlob()], 'test.png', { type: 'image/png' });
  files.txt = new File(['SplitHub share test'], 'test.txt', { type: 'text/plain' });
  const pdf = tinyPdf();
  files.pdf = new File([pdf], 'smeta-test.pdf', { type: 'application/pdf' });
  files.pdfOctet = new File([pdf], 'smeta-test.pdf', { type: 'application/octet-stream' });
  files.pdfShort = new File([pdf], 'a.pdf', { type: 'application/pdf' });
  document.getElementById('tests').innerHTML = tests.map((t, i) =>
    `<button onclick="run(${i})">${i + 1}. ${t[0]}<small>${t[1]}</small></button><div class="r" id="r${i}"></div>`).join('');
  document.getElementById('env').textContent = navigator.userAgent +
    ' · share: ' + typeof navigator.share + ' · canShare: ' + typeof navigator.canShare +
    ' · secure: ' + window.isSecureContext + ' · iframe: ' + (window.top !== window);
})();
</script>
</body>
</html>
